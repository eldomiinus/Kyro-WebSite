<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ============================================================
         KYRO - Lista de Deseos
         Muestra los productos marcados con el corazón.
         ============================================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de deseos — Kyro</title>

    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../components/navbar.css" />
    <link rel="stylesheet" href="../components/footer.css" />
    <link rel="stylesheet" href="../components/cart.css" />
    <link rel="stylesheet" href="../components/wishlist.css" />
    <link rel="stylesheet" href="../components/product-card.css" />
</head>
<body>
    <div id="navbar-root"></div>

    <main class="wishlist-page">
        <header class="wishlist-header">
            <div>
                <h1>Mi lista de deseos</h1>
                <p id="wishlist-count">Cargando…</p>
            </div>
            <div class="wishlist-actions">
                <button type="button" class="btn-secondary" id="clear-wishlist">Vaciar lista</button>
                <a class="btn-primary" href="catalog.html">Seguir explorando</a>
            </div>
        </header>

        <div id="wishlist-grid" class="products-grid">
            <!-- Renderizado por assets/js/wishlist-page.js -->
        </div>

        <p id="wishlist-empty" class="empty-state" hidden>
            Aún no marcaste ningún producto con el corazón.
            <br />
            <a href="catalog.html">Ir al catálogo</a> para empezar.
        </p>
    </main>

    <div id="footer-root"></div>
    <aside id="side-cart" class="side-cart" aria-hidden="true"></aside>
    <div id="cart-overlay" class="cart-overlay" hidden></div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/social.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/cart.js"></script>
    <script src="../components/wishlist.js"></script>
    <script src="../assets/js/wishlist-page.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
