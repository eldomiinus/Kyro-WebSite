<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ============================================================
         KYRO - Blog
         Feed de artículos con tarjeta estándar: imagen, fecha,
         título y extracto.
         Los artículos se sirven desde KYRO.articles (data.js).
         ============================================================ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — Kyro</title>

    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../components/navbar.css" />
    <link rel="stylesheet" href="../components/footer.css" />
    <link rel="stylesheet" href="../components/cart.css" />
    <link rel="stylesheet" href="../components/wishlist.css" />
    <link rel="stylesheet" href="../components/blog.css" />
</head>
<body>
    <div id="navbar-root"></div>

    <main class="blog-page">
        <header class="page-header">
            <h1>Blog</h1>
            <p>
                Novedades del proyecto, anuncios de nuevos diseños, procesos
                manuales y cualquier cosa que la comunidad quiera compartir.
            </p>
        </header>

        <div id="blog-grid" class="blog-grid">
            <!-- Renderizado por assets/js/blog.js -->
        </div>

        <p id="blog-empty" class="empty-state" hidden>
            Aún no hay artículos publicados.
        </p>
    </main>

    <div id="footer-root"></div>
    <aside id="side-cart" class="side-cart" aria-hidden="true"></aside>
    <div id="cart-overlay" class="cart-overlay" hidden></div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/social.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/cart.js"></script>
    <script src="../components/wishlist.js"></script>
    <script src="../assets/js/blog.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
